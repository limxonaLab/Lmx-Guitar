.dlg ul,.dlg ol{padding-left:20px}
.dlg li{margin-bottom:6px}

.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}

body.lock{overflow:hidden}

hint:"Diyagrama dokunarak akoru dinle, diğer varyasyonlar için kaydır. Koyu nokta kök notadır.",voicing:"Varyasyon",prevL:"Önceki varyasyon",nextL:"Sonraki varyasyon",finger:"Parmak",note:"Nota",open:"Açık pozisyon",fret:"Perde",knownOn:"Bu basılışı biliyorum",knownOff:"Bu basılışı bildiklerimden çıkar",

none:"Bu akor için uygun bir dizilim bulunamadı.",title:"Lmx Chords Akor Bulucu – Gitar Akorları ve Parmak Pozisyonları",

hs:[["Hızlı başlangıç",`<ol>
<li><b>Kök notayı seç:</b> üstteki C D E F G A B düğmelerinden birine bas. Bemol ya da diyez için soldaki ♭ ♮ ♯ düğmelerini kullan (örneğin B + ♭ = B♭).</li>
<li><b>Akor türünü seç:</b> Maj, Min, 7, Sus gibi bir tür seç. Akorun adı ve içindeki notalar diyagramın altında yazar.</li>
<li><b>Varyasyonlara bak:</b> diyagramı sağa sola kaydırarak aynı akorun farklı basılışlarını gez.</li>
<li><b>Dinle:</b> diyagrama dokun ya da tıkla, akor çalınır.</li></ol>`],
["Diyagramı okumak",`<p>Diyagram gitar sapını karşıdan gösterir. Soldan sağa teller 6. (en kalın), 5., 4., 3., 2. ve 1. (en ince) tel; yukarıdan aşağıya perdelerdir.</p>
<ul>
<li><i class="sw r"></i><b>Koyu nokta:</b> akorun kök notası. (Gece temasında açık renk görünür.)</li>
<li><i class="sw n"></i><b>Turuncu nokta:</b> akorun diğer notaları.</li>
<li><i class="sw b"></i><b>Soluk turuncu çubuk:</b> barre, yani tek parmakla birden fazla teli birlikte basmak.</li>
<li><b>Noktanın içindeki sayı:</b> parmak numarası. 1 işaret, 2 orta, 3 yüzük, 4 serçe parmaktır. Sağ üstteki <b>Nota</b> düğmesiyle sayıların yerine nota adları görünür.</li>
<li><b>○</b> o tel boş (basılmadan) çalınır, <b>×</b> o tel çalınmaz.</li>
<li><b>Sol kenardaki sayı:</b> diyagramın başladığı perde. Sayı yoksa diyagram 1. perdeden başlar; üstteki kalın çizgi üst eşiktir.</li>
<li><b>Alttaki harfler:</b> her telde çıkan notanın adı.</li></ul>`],
["Varyasyonlar ve gezinme",`<p>Aynı akor gitarda birçok farklı yerden çalınabilir. Her akor için en fazla 10 varyasyon gösterilir; az notalı akorlarda daha az çıkabilir.</p>
<ul>
<li><b>Sıralama:</b> bilinen standart basılış ve rahat bir alternatif önce gösterilir; kalan varyasyonlar üst eşiğe yakın pozisyondan sapın ilerisine doğru sıralanır.</li>
<li><b>Gezinme:</b> dokunmatik ekranda kaydır. Bilgisayarda mouse ile sürükle, yanlardaki ‹ › düğmelerine bas ya da diyagram seçiliyken <kbd>←</kbd> <kbd>→</kbd> tuşlarını kullan.</li>
<li><b>Alttaki yuvarlaklar:</b> varyasyon sayısı kadardır. Birine dokunursan doğrudan o varyasyona gidersin.</li>
<li><b>Etiket:</b> diyagramın altında "Açık pozisyon" ya da "Perde N" ile kaçıncı varyasyon olduğu yazar.</li>
<li><b>Ses:</b> akor basit bir sentezle çalınır, gerçek gitar sesi değildir. Amaç doğru tellerin duyulmasıdır.</li></ul>`],
["Akor türleri",`<p>Türler kolaydan ileriye beş grupta sıralanmıştır; küçük ekranlarda satırlara yayılır.</p>
<ul>
<li><b>1. grup:</b> Maj, Min, 7, m7, Maj7, 5 ve Sus4 gibi sık kullanılan akorlar.</li>
<li><b>2. grup:</b> Sus2, Add9, mAdd9, 6, m6, 6/9, 7sus4 ve 9sus4.</li>
<li><b>3. grup:</b> 9, Maj9, m9, mMaj7, mMaj9, 11, m11 ve 13.</li>
<li><b>4. grup:</b> Dim, Dim7, m7♭5, Aug, 7♭5, 7♯5, 7♭9 ve 7♯9.</li>
<li><b>5. grup:</b> 7add11, 7♯11, Maj7♯11, m13 ve Maj13.</li></ul>`],
["Notalar ve bemol / diyez",`<ul>
<li>Akor adının altındaki harfler seçili pozisyonda gerçekten çalan notalardır (örneğin C · E · G). Geniş akorlarda bazı isteğe bağlı sesler çıkarılabilir.</li>
<li>Bemol (♭) seçersen notalar bemollü yazılır (D♭ gibi), diyez (♯) seçersen diyezli yazılır (C♯ gibi). ♮ hiçbirini seçmemek demektir. F akorunda bemol kullanılır (B♭ gibi).</li>
<li><b>Parmak / Nota</b> düğmesi noktaların içini parmak numarası ya da nota adı yapar.</li>
<li><b>Bul</b> düğmesinde kapoyu, açık veya susturulmuş telleri ve bastığın perdeleri seçerek akor adını öğrenebilirsin.</li>
<li>Tüm diyagramlar standart gitar akordu (E A D G B E) içindir.</li></ul>`],
["Kısayollar ve hatırlama",`<ul>
<li><kbd>←</kbd> <kbd>→</kbd>: önceki / sonraki varyasyon (diyagram seçiliyken)</li>
<li><kbd>Esc</kbd>: bu pencereyi kapatır</li>

  // susturulmuş veya daha düşük perdeden çalınan bir telin üzerinden geçemez.

      var s=[];fr.forEach(function(f,i){if(f===+key)s.push(i);});

  h+='<rect class="board" x="24" y="36" width="85" height="110"/>';
  for(r=0;r<R;r++){
    var fret=B+r,mid=TOP+(r+.5)*RH;
    if([3,5,7,9,12,15,17,19,21,24].indexOf(fret)>=0){
      var marks=fret===12||fret===24?[X(2)-5,X(3)+5]:[(X(2)+X(3))/2];
      marks.forEach(function(x){h+='<circle class="inlay" cx="'+x+'" cy="'+mid+'" r="3.7"/>';});
    }
  }
  for(r=1;r<R;r++)h+='<line class="fretwire" x1="'+left+'" x2="'+right+'" y1="'+(TOP+r*RH)+'" y2="'+(TOP+r*RH)+'"/>';
  var upperWidth=B===1?5.5:2,lowerWidth=2;
  for(i=0;i<6;i++)h+='<line class="string" style="stroke-width:'+W(i).toFixed(2)+'" x1="'+X(i)+'" x2="'+X(i)+'" y1="'+(TOP-upperWidth/2)+'" y2="'+(TOP+R*RH+lowerWidth/2)+'"/>';
  h+='<line class="fretwire" x1="'+left+'" x2="'+right+'" y1="'+(TOP+R*RH)+'" y2="'+(TOP+R*RH)+'"/>';
  h+='<line class="'+(B===1?"nut":"fretwire")+'" x1="'+left+'" x2="'+right+'" y1="'+TOP+'" y2="'+TOP+'"/>';
  if(B>1)h+='<text class="fr" x="3" y="'+(TOP+RH/2+4)+'">'+B+'</text>';
  v.fr.forEach(function(f,i){
    if(f<0)h+='<path class="mx" d="M'+(X(i)-3.5)+' 21l7 7m0-7l-7 7"/>';
    else if(f===0)h+='<circle class="op" cx="'+X(i)+'" cy="24.5" r="4"/>';
    h+='<text class="tx" x="'+X(i)+'" y="'+(TOP+R*RH+16)+'">'+(f<0?"":nm(TUN[i]+f))+'</text>';
  });
  v.groups.forEach(function(g){
    var y=TOP+(g.f-B+.5)*RH;
    if(g.bar)h+='<rect class="bar" x="'+(X(g.a)-8)+'" y="'+(y-8)+'" width="'+(X(g.b)-X(g.a)+16)+'" height="16" rx="8"/>';
  });
  v.fr.forEach(function(f,i){
    if(f<=0)return;
    var y=TOP+(f-B+.5)*RH,isR=(TUN[i]+f)%12===rp,g=v.groups.filter(function(g){return g.a<=i&&i<=g.b&&g.f===f;})[0];
    var lab=S.mode==="note"?nm(TUN[i]+f):(g.bar&&i!==g.a?"":v.fg[i]);
    h+='<circle class="dot'+(isR?" r":"")+'" cx="'+X(i)+'" cy="'+y+'" r="7.6"/><text class="dt" x="'+X(i)+'" y="'+(y+3.6)+'"'+(S.mode==="note"&&lab.length>1?' style="font-size:8px"':"")+'>'+lab+'</text>';
  });
  return h+"</svg>";
}

var AC;
function strum(v){
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  var t0=AC.currentTime+.02,k=0;
  v.fr.forEach(function(f,i){
    if(f<0)return;
    var o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter(),tt=t0+k++*.045;
    o.type="triangle";o.frequency.value=440*Math.pow(2,(TUN[i]+f-69)/12);
    lp.type="lowpass";lp.frequency.value=2200;
    g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.2,tt+.008);g.gain.exponentialRampToValueAtTime(.0001,tt+1.6);
    o.connect(lp);lp.connect(g);g.connect(AC.destination);o.start(tt);o.stop(tt+1.7);
  });
}

function $(id){return document.getElementById(id);}
var VS=[],cur=0,raf=0;
var known=new Set();
try{var storedKnown=JSON.parse(localStorage.getItem("lmx-known-chords")||"[]");if(Array.isArray(storedKnown))storedKnown.forEach(function(k){if(typeof k==="string")known.add(k);});}catch(e){}
function chordKey(){return rootPc()+"|"+S.q;}
function voicingKey(v){return "v2|"+chordKey()+"|"+v.fr.join(",");}
function saveKnown(){try{localStorage.setItem("lmx-known-chords",JSON.stringify(Array.from(known)));}catch(e){}}
function updateKnown(button,key){var active=known.has(key),label=t(active?"knownOff":"knownOn");button.setAttribute("aria-pressed",String(active));button.setAttribute("aria-label",label);button.title=label;}
function step(){var c=$("car").children;return c.length>1?c[1].offsetLeft-c[0].offsetLeft:($("car").clientWidth||1);}
function sync(){
  var n=VS.length;cur=n?Math.max(0,Math.min(n-1,Math.round($("car").scrollLeft/step()))):0;
  Array.prototype.forEach.call($("dots").children,function(d,i){d.setAttribute("aria-current",String(i===cur));});
  $("prev").disabled=cur<=0;$("next").disabled=cur>=n-1;
}
function go(i,smooth){i=Math.max(0,Math.min(VS.length-1,i));$("car").scrollTo({left:i*step(),behavior:smooth?"smooth":"auto"});}
function render(keep){
  if(!keep)cur=0;
  var rp=rootPc(),q=qdef(),sym=S.root+S.acc+q[2];
  VS=gen(rp,q[3],q[0],q[4]);
  // Önceki sürümde tüm akor için tutulan işareti ilk basılışa taşı.
  if(VS.length&&known.has(chordKey())){known.delete(chordKey());known.add(voicingKey(VS[0]));saveKnown();}
  var car=$("car"),dots=$("dots");car.innerHTML="";dots.innerHTML="";
  if(!VS.length)car.innerHTML='<div class="none">'+t("none")+'</div>';
  VS.forEach(function(v,i){
    var notes=q[3].filter(function(iv){return v.fr.some(function(f,s){return f>=0&&(TUN[s]+f)%12===(rp+iv)%12;});}).map(function(iv){return nm(rp+iv);}).join(" · ");
    var card=document.createElement("div");card.className="slide";
    var play=document.createElement("button");play.type="button";play.className="play-voicing";
    play.setAttribute("aria-label",sym+" · "+t("voicing")+" "+(i+1)+" · "+t("play"));
    play.innerHTML=draw(v,rp)+'<div class="cn">'+sym+'</div><div class="nt">'+notes+"</div><small>"+(v.open?t("open"):t("fret")+" "+v.mn)+" · "+(i+1)+" / "+VS.length+"</small>";
    play.onclick=function(){strum(v);};card.appendChild(play);
    var badge=document.createElement("button"),key=voicingKey(v);
    badge.type="button";badge.className="known";badge.textContent="✓";updateKnown(badge,key);
    badge.onclick=function(){if(known.has(key))known.delete(key);else known.add(key);saveKnown();updateKnown(badge,key);};
    card.appendChild(badge);car.appendChild(card);
    var d=document.createElement("button");d.type="button";d.setAttribute("aria-label",t("voicing")+" "+(i+1));
    d.onclick=function(){go(i,true);};dots.appendChild(d);
  });
  if(cur>=VS.length)cur=0;
  go(cur,false);sync();
  document.querySelectorAll("#roots .chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.r===S.root));});
  document.querySelectorAll("#acc button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.a===S.acc));});
  document.querySelectorAll("#quals .chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.q===S.q));});
  document.querySelectorAll("#mode button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.m===S.mode));});
  try{localStorage.setItem("lmx-chord",JSON.stringify(S));}catch(e){}
}
$("car").addEventListener("scroll",function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(sync);},{passive:true});
$("car").addEventListener("keydown",function(e){if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1,true);}else if(e.key==="ArrowRight"){e.preventDefault();go(cur+1,true);}});
var drag=null,moved=false,snapT=0,lastX=0,lastT=0,vel=0;
$("car").addEventListener("pointerdown",function(e){
  if(e.pointerType!=="mouse"||e.button!==0||!VS.length)return;
  clearTimeout(snapT);drag={x:e.clientX,l:$("car").scrollLeft};moved=false;lastX=e.clientX;lastT=e.timeStamp;vel=0;$("car").style.scrollSnapType="none";$("car").classList.add("drag");
});
window.addEventListener("pointermove",function(e){
  if(!drag)return;var d=e.clientX-drag.x,dt=e.timeStamp-lastT;if(Math.abs(d)>4)moved=true;$("car").scrollLeft=drag.l-d;if(dt>0){vel=.8*vel+.2*((lastX-e.clientX)/dt);lastX=e.clientX;lastT=e.timeStamp;}
});
window.addEventListener("pointerup",function(e){
  if(!drag)return;
  var d=drag.x-e.clientX,pos=$("car").scrollLeft/step();
  drag=null;$("car").classList.remove("drag");
  var kick=Math.abs(vel)>.4?Math.sign(vel)*.45:(Math.abs(d)>8?(d>0?.3:-.3):0);
  go(Math.round(pos+kick),true);
  snapT=setTimeout(function(){$("car").style.scrollSnapType="";},500);
});
$("car").addEventListener("click",function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
$("prev").onclick=function(){go(cur-1,true);};$("next").onclick=function(){go(cur+1,true);};
window.addEventListener("resize",function(){go(cur,false);});
var F={fr:[null,null,null,null,null,null],capo:0},finderOpener=null;
try{
  var savedFinder=JSON.parse(localStorage.getItem("lmx-chord-finder")||"null");
  if(savedFinder&&Array.isArray(savedFinder.fr)&&savedFinder.fr.length===6&&
     savedFinder.fr.every(function(f){return f===null||Number.isInteger(f)&&f>=-1&&f<=12;})&&
     Number.isInteger(savedFinder.capo)&&savedFinder.capo>=0&&savedFinder.capo<=12)F=savedFinder;
}catch(e){}
function saveFinder(){try{localStorage.setItem("lmx-chord-finder",JSON.stringify(F));}catch(e){}}
function renderFinder(focusCell){
  var grid=$("fneck");grid.innerHTML="";
  function cell(tag,cls,label){var el=document.createElement(tag);el.className=cls;el.textContent=label;grid.appendChild(el);return el;}
  cell("div","find-head",t("stringLabel"));cell("div","find-head","○ / ×");
  for(var f=1;f<=12;f++)cell("div","find-head",String(F.capo+f));
  ["E","A","D","G","B","e"].forEach(function(name,s){
    cell("div","find-string",name);
    var open=cell("button","find-open-string","");open.type="button";open.style.setProperty("--sw",(2.4-s*.27)+"px");
    open.dataset.findCell="open-"+s;
    open.innerHTML="<span>"+(F.fr[s]===0?"○":F.fr[s]===-1?"×":"")+"</span>";
    open.setAttribute("aria-pressed",String(F.fr[s]===0||F.fr[s]===-1));
    open.setAttribute("aria-label",(6-s)+". "+t("stringLabel")+" "+name+": "+t(F.fr[s]===0?"openString":F.fr[s]===-1?"mutedString":"unsetString"));
    open.onclick=function(){F.fr[s]=F.fr[s]===null?0:F.fr[s]===0?-1:null;saveFinder();renderFinder("open-"+s);};
    for(var fret=1;fret<=12;fret++)(function(k){
      var b=cell("button","find-fret","");b.type="button";b.style.setProperty("--sw",(2.4-s*.27)+"px");
      b.dataset.findCell="fret-"+s+"-"+k;
      b.innerHTML="<span></span>";b.setAttribute("aria-pressed",String(F.fr[s]===k));
      b.setAttribute("aria-label",(6-s)+". "+t("stringLabel")+" "+name+", "+(F.capo+k)+". "+t("fretLabel")+" · "+FIND_NAMES[(TUN[s]+F.capo+k)%12]);
      b.onclick=function(){F.fr[s]=F.fr[s]===k?null:k;saveFinder();renderFinder("fret-"+s+"-"+k);};
    })(fret);
  });
  var notes=F.fr.map(function(f,s){return f===null||f<0?null:{midi:TUN[s]+F.capo+f,string:s};}).filter(Boolean);
  $("fnotes").textContent=t("findNotes")+": "+(notes.length?notes.map(function(n){return FIND_NAMES[n.midi%12];}).join(" · "):"—");
  var matches=identifyChord(F.fr,F.capo),results=$("fresults");results.innerHTML="";
  if(focusCell){var selected=grid.querySelector('[data-find-cell="'+focusCell+'"]');if(selected)selected.focus();}
  if(!matches.length){results.textContent=new Set(notes.map(function(n){return n.midi%12;})).size<2?t("findEmpty"):t("findNone");return;}
  var main=document.createElement("strong");main.textContent=matches[0].name;results.appendChild(main);
  if(matches.length>1){var other=document.createElement("small");other.textContent=t("findOther")+": "+matches.slice(1,6).map(function(m){return m.name;}).join(" · ");results.appendChild(other);}
}
