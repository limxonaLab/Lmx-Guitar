hs:[["Hızlı başlangıç",`<ol>
<li><b>Kök notayı seç:</b> üstteki C D E F G A B düğmelerinden birine bas. Bemol ya da diyez için soldaki ♭ ♮ ♯ düğmelerini kullan (örneğin B + ♭ = B♭).</li>
<li><b>Akor türünü seç:</b> Maj, Min, 7, Sus gibi bir tür seç. Akorun adı ve içindeki notalar diyagramın altında yazar.</li>
<li><b>Varyasyonlara bak:</b> diyagramı sağa sola kaydırarak aynı akorun farklı basılışlarını gez.</li>
<li><b>Dinle:</b> diyagrama ilk dokunuşta akor birlikte, ikinci dokunuşta teller tek tek çalınır.</li></ol>`],
["Diyagramı okumak",`<p>Diyagram gitar sapını karşıdan gösterir. Soldan sağa teller 6. (en kalın), 5., 4., 3., 2. ve 1. (en ince) tel; yukarıdan aşağıya perdelerdir.</p>
<ul>
<li><i class="sw r"></i><b>Koyu nokta:</b> akorun kök notası. (Gece temasında açık renk görünür.)</li>
<li><i class="sw n"></i><b>Turuncu nokta:</b> akorun diğer notaları.</li>
<li><i class="sw b"></i><b>Soluk turuncu çubuk:</b> barre, yani tek parmakla birden fazla teli birlikte basmak.</li>
<li><b>Noktanın içindeki sayı:</b> parmak numarası. 1 işaret, 2 orta, 3 yüzük, 4 serçe parmaktır. Sağ üstteki <b>Nota</b> düğmesiyle sayıların yerine nota adları görünür.</li>
<li><b>Basış kuralı:</b> yalnızca işaret parmağı bare yapabilir. Diğer parmaklar birer tele basar; en fazla dört parmakla basılabilen varyasyonlar gösterilir.</li>
<li><b>○</b> o tel boş (basılmadan) çalınır, <b>×</b> o tel çalınmaz.</li>
<li><b>Sol kenardaki sayı:</b> diyagramın başladığı perde. Sayı yoksa diyagram 1. perdeden başlar; üstteki kalın çizgi üst eşiktir.</li>
<li><b>Alttaki harfler:</b> her telde çıkan notanın adı.</li></ul>`],
["Varyasyonlar ve gezinme",`<p>Aynı akor gitarda birçok farklı yerden çalınabilir. Her akor için en fazla 10 varyasyon gösterilir; az notalı akorlarda daha az çıkabilir.</p>
<ul>
<li><b>Sıralama:</b> bilinen standart basılış ve rahat bir alternatif önce gösterilir; kalan varyasyonlar üst eşiğe yakın pozisyondan sapın ilerisine doğru sıralanır.</li>
<li><b>Gezinme:</b> dokunmatik ekranda kaydır. Bilgisayarda mouse ile sürükle, yanlardaki ‹ › düğmelerine bas ya da diyagram seçiliyken <kbd>←</kbd> <kbd>→</kbd> tuşlarını kullan.</li>
<li><b>Alttaki yuvarlaklar:</b> varyasyon sayısı kadardır. Birine dokunursan doğrudan o varyasyona gidersin.</li>
<li><b>Etiket:</b> diyagramın altında "Açık pozisyon" ya da "Perde N" ile kaçıncı varyasyon olduğu yazar.</li>
<li><b>Ses:</b> akor basit bir sentezle çalınır, gerçek gitar sesi değildir. Amaç doğru tellerin duyulmasıdır.</li></ul>`],
["Akor türleri",`<p>Türler kolaydan ileriye beş grupta sıralanmıştır; küçük ekranlarda satırlara yayılır.</p>
<ul>
<li><b>1. grup:</b> Maj, Min, 7, m7, Maj7, 5 ve Sus4 gibi sık kullanılan akorlar.</li>
<li><b>2. grup:</b> Sus2, Add9, mAdd9, 6, m6, 6/9, 7sus4 ve 9sus4.</li>
<li><b>3. grup:</b> 9, Maj9, m9, mMaj7, mMaj9, 11, m11 ve 13.</li>
<li><b>4. grup:</b> Dim, Dim7, m7♭5, Aug, 7♭5, 7♯5, 7♭9 ve 7♯9.</li>
<li><b>5. grup:</b> 7add11, 7♯11, Maj7♯11, m13 ve Maj13.</li></ul>`],
["Notalar ve bemol / diyez",`<ul>
<li>Akor adının altındaki harfler seçili pozisyonda gerçekten çalan notalardır (örneğin C · E · G). Geniş akorlarda bazı isteğe bağlı sesler çıkarılabilir.</li>
<li>Bemol (♭) seçersen notalar bemollü yazılır (D♭ gibi), diyez (♯) seçersen diyezli yazılır (C♯ gibi). ♮ hiçbirini seçmemek demektir. F akorunda bemol kullanılır (B♭ gibi).</li>
<li><b>Parmak / Nota</b> düğmesi noktaların içini parmak numarası ya da nota adı yapar.</li>
<li><b>Bul</b> düğmesinde kapoyu, açık veya susturulmuş telleri ve bastığın perdeleri seçerek akor adını öğrenebilirsin.</li>
<li>Tüm diyagramlar standart gitar akordu (E A D G B E) içindir.</li></ul>`],
["Kısayollar ve hatırlama",`<ul>
<li><kbd>←</kbd> <kbd>→</kbd>: önceki / sonraki varyasyon (diyagram seçiliyken)</li>
<li><kbd>Esc</kbd>: bu pencereyi kapatır</li>
<li><b>TR / EN</b> düğmesi dili değiştirir. Seçim ana sayfadakiyle ortaktır.</li>
<li><b>Gündüz / Gece</b> düğmesi görünümü değiştirir, tercih hatırlanır.</li></ul>
<p><b>Bu sayfa seni hatırlar:</b> son seçtiğin kök, akor türü, Parmak / Nota tercihi, dil ve her varyasyon kartındaki ✓ ile işaretlediğin basılışlar bu tarayıcıda saklanır.</p>`]],

hs:[["Quick start",`<ol>
<li><b>Pick a root note:</b> press one of the C D E F G A B buttons at the top. For a flat or sharp use the ♭ ♮ ♯ buttons on the left (for example B + ♭ = B♭).</li>
<li><b>Pick a chord type:</b> choose something like Maj, Min, 7 or Sus. The chord name and its notes are shown below the diagram.</li>
<li><b>Browse the voicings:</b> slide the diagram left or right to see different ways to play the same chord.</li>
<li><b>Listen:</b> tap the diagram once to hear the chord together, then again to hear each string separately.</li></ol>`],
["Reading the diagram",`<p>The diagram shows the guitar neck face-on. From left to right the strings are 6th (thickest), 5th, 4th, 3rd, 2nd and 1st (thinnest); frets run from top to bottom.</p>
<ul>
<li><i class="sw r"></i><b>Dark dot:</b> the root note of the chord. (It looks light in the dark theme.)</li>
<li><i class="sw n"></i><b>Orange dot:</b> the other notes of the chord.</li>
<li><i class="sw b"></i><b>Faint orange bar:</b> a barre, which means pressing several strings with one finger.</li>
<li><b>Number inside a dot:</b> the finger number. 1 is the index, 2 the middle, 3 the ring and 4 the little finger. The <b>Note</b> button on the right shows note names instead of numbers.</li>
<li><b>Fingering rule:</b> only the index finger can form a barre. Each other finger presses one string; only voicings playable with up to four fingers are shown.</li>
<li><b>○</b> means the string is played open (not pressed), <b>×</b> means the string is not played.</li>
<li><b>Number on the left edge:</b> the fret where the diagram starts. With no number it starts at the 1st fret and the thick line at the top is the nut.</li>
<li><b>Letters at the bottom:</b> the note produced on each string.</li></ul>`],
["Voicings and navigation",`<p>The same chord can be played in many places on the neck. Up to 10 voicings are shown for each chord; some chords may have fewer.</p>
<ul>
<li><b>Order:</b> a familiar standard shape and a comfortable alternative appear first; remaining voicings progress from near the nut up the neck.</li>
<li><b>Navigating:</b> on a touch screen just swipe. On a computer drag with the mouse, press the ‹ › buttons at the sides, or use <kbd>←</kbd> <kbd>→</kbd> while the diagram is focused.</li>
<li><b>Dots at the bottom:</b> one for each voicing. Tap one to jump straight to it.</li>
<li><b>Label:</b> under the diagram you see "Open position" or "Fret N" and which voicing it is.</li>
<li><b>Sound:</b> the chord is played with a simple synthesizer, not a real guitar. The point is to hear the right strings.</li></ul>`],
["Chord types",`<p>Chord types are arranged from common to advanced in five groups; they wrap on small screens.</p>
<ul>
<li><b>Group 1:</b> frequently used Maj, Min, 7, m7, Maj7, 5 and Sus4.</li>
<li><b>Group 2:</b> Sus2, Add9, mAdd9, 6, m6, 6/9, 7sus4 and 9sus4.</li>
<li><b>Group 3:</b> 9, Maj9, m9, mMaj7, mMaj9, 11, m11 and 13.</li>
<li><b>Group 4:</b> Dim, Dim7, m7♭5, Aug, 7♭5, 7♯5, 7♭9 and 7♯9.</li>
<li><b>Group 5:</b> 7add11, 7♯11, Maj7♯11, m13 and Maj13.</li></ul>`],
["Notes and flats / sharps",`<ul>
<li>The letters below the chord name are the notes actually sounded in the selected voicing (for example C · E · G). Extended voicings may omit optional chord tones.</li>
<li>If you choose flat (♭) notes are written with flats (like D♭), if you choose sharp (♯) with sharps (like C♯). ♮ means neither. F chords use flats (like B♭).</li>
<li>The <b>Finger / Note</b> button switches the dots between finger numbers and note names.</li>
<li>Use <b>Find</b> to enter a capo, open or muted strings and fretted notes, then identify the chord.</li>
<li>All diagrams are for standard guitar tuning (E A D G B E).</li></ul>`],
["Shortcuts and memory",`<ul>
<li><kbd>←</kbd> <kbd>→</kbd>: previous / next voicing (while the diagram is focused)</li>
<li><kbd>Esc</kbd>: closes this window</li>
<li>The <b>TR / EN</b> button switches the language. It is shared with the home page.</li>
<li>The <b>Day / Night</b> button switches the theme and your choice is remembered.</li></ul>
<p><b>This page remembers you:</b> your last root, chord type, Finger / Note choice, language and individual voicings marked with ✓ on each card are stored in this browser.</p>`]],

/* ---- parmak ataması ---- */
function fing(fr){
  var pressed=[],min=Infinity,best=null,bestCost=Infinity;
  fr.forEach(function(f,i){if(f>0){pressed.push(i);min=Math.min(min,f);}});
  // Tek bareye izin verilir ve o bare yalnızca 1. parmağa atanır.
  // Diğer üç parmağın her biri yalnızca bir telde tek nota basar.
  function assign(bar){
    var groups=[],fg=[0,0,0,0,0,0];
    if(bar)groups.push({f:bar.f,a:bar.a,b:bar.b,bar:true});
    pressed.forEach(function(i){
      if(!bar||i<bar.a||i>bar.b||fr[i]!==bar.f)
        groups.push({f:fr[i],a:i,b:i,bar:false});
    });
    if(groups.length>4)return null;
    groups.sort(function(a,b){return a.f-b.f||b.bar-a.bar||a.a-b.a;});
    var chosenFingers=null,lowestCost=Infinity;
    (function search(pos,last,cost,numbers){
      if(pos===groups.length){if(cost<lowestCost){lowestCost=cost;chosenFingers=numbers.slice();}return;}
      var target=Math.min(4,groups[pos].f-min+1);
      for(var finger=last+1;finger<=4-(groups.length-pos-1);finger++){
        if(groups[pos].bar&&finger!==1)continue;
        if(groups[pos].f-min>=3&&finger===2)continue;
        var stretch=0;
        for(var k=0;k<pos;k++)stretch+=Math.max(0,groups[pos].f-groups[k].f-(finger-numbers[k]))*2;
        numbers.push(finger);
        search(pos+1,finger,cost+Math.abs(finger-target)+stretch,numbers);
        numbers.pop();
      }
    })(0,0,0,[]);
    if(!chosenFingers)return null;
    groups.forEach(function(g,k){
      g.n=chosenFingers[k];
      for(var i=g.a;i<=g.b;i++)if(fr[i]===g.f)fg[i]=g.n;
    });
    return{fg:fg,groups:groups,n:groups.length};
  }
  function consider(bar){
    var result=assign(bar);if(!result)return;
    var cost=result.n*5+(bar?2+(bar.b-bar.a)*.1:0);
    // Açık tiz tele taşma riski varsa, ayrı parmaklarla basış öne gelir.
    if(bar&&bar.b<5&&fr[bar.b+1]===0)cost+=10;
    if(cost<bestCost){best=result;bestCost=cost;}
  }
  consider(null);
  var atMin=pressed.filter(function(i){return fr[i]===min;}),seen={};
  for(var a=0;a<atMin.length;a++)for(var b=a+1;b<atMin.length;b++){
    var first=atMin[a],last=atMin[b],valid=true;
    // Bare açık, susturulmuş veya daha düşük perdedeki notayı kesemez.
    for(var i=first;i<=last;i++)if(fr[i]<min)valid=false;
    if(!valid)continue;
    while(first>0&&fr[first-1]>=min)first--;
    while(last<5&&fr[last+1]>=min)last++;
    var key=first+":"+last;
    if(!seen[key]){seen[key]=true;consider({f:min,a:first,b:last});}
  }
  return best;
}

  if(!VS.length)car.innerHTML='<div class="none">'+t("none")+'</div>';
  VS.forEach(function(v,i){
    var notes=q[3].filter(function(iv){return v.fr.some(function(f,s){return f>=0&&(TUN[s]+f)%12===(rp+iv)%12;});}).map(function(iv){return nm(rp+iv);}).join(" · ");
    var card=document.createElement("div");card.className="slide";
    var play=document.createElement("button");play.type="button";play.className="play-voicing";
    play.setAttribute("aria-label",sym+" · "+t("voicing")+" "+(i+1)+" · "+t("play"));
    play.innerHTML=draw(v,rp)+'<div class="cn">'+sym+'</div><div class="nt">'+notes+"</div><small>"+(v.open?t("open"):t("fret")+" "+v.mn)+" · "+(i+1)+" / "+VS.length+"</small>";
    var nextOneByOne=false;
    play.onclick=function(){strum(v,nextOneByOne);nextOneByOne=!nextOneByOne;};card.appendChild(play);
    var badge=document.createElement("button"),key=voicingKey(v);
    badge.type="button";badge.className="known";badge.textContent="✓";updateKnown(badge,key);
    badge.onclick=function(){if(known.has(key))known.delete(key);else known.add(key);saveKnown();updateKnown(badge,key);};
    card.appendChild(badge);car.appendChild(card);
    var d=document.createElement("button");d.type="button";d.setAttribute("aria-label",t("voicing")+" "+(i+1));
    d.onclick=function(){go(i,true);};dots.appendChild(d);
  });
  if(cur>=VS.length)cur=0;
  go(cur,false);sync();
  document.querySelectorAll("#roots .chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.r===S.root));});
  document.querySelectorAll("#acc button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.a===S.acc));});
  document.querySelectorAll("#quals .chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.q===S.q));});
  document.querySelectorAll("#mode button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.m===S.mode));});
  try{localStorage.setItem("lmx-chord",JSON.stringify(S));}catch(e){}
}
$("car").addEventListener("scroll",function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(sync);},{passive:true});
$("car").addEventListener("keydown",function(e){if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1,true);}else if(e.key==="ArrowRight"){e.preventDefault();go(cur+1,true);}});
var drag=null,moved=false,snapT=0,lastX=0,lastT=0,vel=0;
$("car").addEventListener("pointerdown",function(e){
  moved=false;
  if(e.target.closest(".known"))return;
  if(e.pointerType!=="mouse"||e.button!==0||!VS.length)return;
  clearTimeout(snapT);drag={x:e.clientX,l:$("car").scrollLeft};moved=false;lastX=e.clientX;lastT=e.timeStamp;vel=0;$("car").style.scrollSnapType="none";$("car").classList.add("drag");
});
window.addEventListener("pointermove",function(e){
  if(!drag)return;var d=e.clientX-drag.x,dt=e.timeStamp-lastT;if(Math.abs(d)>4)moved=true;$("car").scrollLeft=drag.l-d;if(dt>0){vel=.8*vel+.2*((lastX-e.clientX)/dt);lastX=e.clientX;lastT=e.timeStamp;}
});
window.addEventListener("pointerup",function(e){
  if(!drag)return;
  var d=drag.x-e.clientX,pos=$("car").scrollLeft/step();
  drag=null;$("car").classList.remove("drag");
  var kick=Math.abs(vel)>.4?Math.sign(vel)*.45:(Math.abs(d)>8?(d>0?.3:-.3):0);

  snapT=setTimeout(function(){$("car").style.scrollSnapType="";},500);

var F={fr:[null,null,null,null,null,null],capo:0},finderOpener=null;

  var savedFinder=JSON.parse(localStorage.getItem("lmx-chord-finder")||"null");
  if(savedFinder&&Array.isArray(savedFinder.fr)&&savedFinder.fr.length===6&&
     savedFinder.fr.every(function(f){return f===null||Number.isInteger(f)&&f>=-1&&f<=12;})&&
     Number.isInteger(savedFinder.capo)&&savedFinder.capo>=0&&savedFinder.capo<=12)F=savedFinder;

function saveFinder(){try{localStorage.setItem("lmx-chord-finder",JSON.stringify(F));}catch(e){}}
var FB=1,FB_MAX=8,listenOneByOne=false;
function fitFinderBase(){
  var ks=F.fr.filter(function(f){return f>0;});if(!ks.length)return;
  var lo=Math.min.apply(null,ks),hi=Math.max.apply(null,ks);
  if(lo<FB||hi>FB+4)FB=Math.max(1,Math.min(FB_MAX,lo));
}
function renderFinder(focusCell){
  var grid=$("fneck"),matches=identifyChord(F.fr,F.capo),root=matches.length?matches[0].root:null;
  FB=Math.max(1,Math.min(FB_MAX,FB));var last=FB+4;
  grid.innerHTML="";grid.dataset.capo=String(F.capo>0);grid.dataset.nut=String(FB===1);grid.setAttribute("role","group");grid.setAttribute("aria-label",t("findBoard"));
  function cell(tag,cls,label){var el=document.createElement(tag);el.className=cls;el.textContent=label;return el;}
  var corner=cell("div","find-head find-open-label",""),opens=[],rows=[];
  for(var f=FB;f<=last;f++)rows.push([cell("div","find-head find-fretno",String(F.capo+f))]);
  ["E","A","D","G","B","e"].forEach(function(name,s){
    var openPc=(TUN[s]+F.capo)%12;
    var open=cell("button","find-open-string","");open.type="button";
    open.dataset.findCell="open-"+s;
    open.dataset.state=F.fr[s]===0?"open":F.fr[s]===-1?"muted":"unset";
    if(F.fr[s]===0&&openPc===root)open.classList.add("is-root");
    open.innerHTML="<span>"+(F.fr[s]===0?"○":F.fr[s]===-1?"×":FIND_NAMES[openPc])+"</span>";
    open.setAttribute("aria-pressed",String(F.fr[s]===0||F.fr[s]===-1));
    open.setAttribute("aria-label",(6-s)+". "+t("stringLabel")+" "+name+": "+t(F.fr[s]===0?"openString":F.fr[s]===-1?"mutedString":"unsetString"));
    open.onclick=function(){F.fr[s]=F.fr[s]===0?-1:F.fr[s]===-1?null:0;saveFinder();renderFinder("open-"+s);};
    opens.push(open);
    for(var fret=FB;fret<=last;fret++)(function(k){
      var b=cell("button","find-fret",""),actualFret=F.capo+k,pc=(TUN[s]+actualFret)%12;
      rows[k-FB].push(b);b.type="button";b.style.setProperty("--sw",(4.2-s*.5).toFixed(2)+"px");
      if(s===0)b.classList.add("edge-l");if(s===5)b.classList.add("edge-r");
      if(F.fr[s]===-1)b.classList.add("is-muted");
      if(F.fr[s]===k&&pc===root)b.classList.add("is-root");
      b.dataset.findCell="fret-"+s+"-"+k;
      var double=actualFret===12||actualFret===24;
      var marker=[3,5,7,9,12,15,17,19,21,24].indexOf(actualFret)>=0&&(double?(s===1||s===3):s===2);
      b.innerHTML=(marker?'<i class="find-inlay" aria-hidden="true"></i>':"")+"<span>"+FIND_NAMES[pc]+"</span>";
      b.setAttribute("aria-pressed",String(F.fr[s]===k));
      b.setAttribute("aria-label",(6-s)+". "+t("stringLabel")+" "+name+", "+actualFret+". "+t("fretLabel")+" · "+FIND_NAMES[pc]);
      b.onclick=function(){F.fr[s]=F.fr[s]===k?null:k;saveFinder();renderFinder("fret-"+s+"-"+k);};
    })(fret);
  });
  [corner].concat(opens).forEach(function(el){grid.appendChild(el);});
  rows.forEach(function(r){r.forEach(function(el){grid.appendChild(el);});});
  $("fprev").disabled=FB<=1;$("fnext").disabled=FB>=FB_MAX;
  $("fprev").classList.toggle("has",F.fr.some(function(x){return x>0&&x<FB;}));
  $("fnext").classList.toggle("has",F.fr.some(function(x){return x>last;}));
  listenOneByOne=false;$("flisten").disabled=!soundingNotes(F.fr,F.capo).length;
  $("frange").textContent=t("fretLabel")+" "+(F.capo+FB)+"–"+(F.capo+last);
  var notes=soundingNotes(F.fr,F.capo),pcs=Array.from(new Set(notes.map(function(n){return n%12;})));
  $("fnotes").textContent=t("findNotes")+": "+(notes.length?notes.map(function(n){return FIND_NAMES[n%12]+(Math.floor(n/12)-1);}).join(" · "):"—");
  var results=$("fresults");results.innerHTML="";
  if(focusCell){var selected=grid.querySelector('[data-find-cell="'+focusCell+'"]');if(selected)selected.focus({preventScroll:true});}
  function info(parent,text){var el=document.createElement("small");el.textContent=text;parent.appendChild(el);}
  if(!matches.length){
    if(!pcs.length){results.textContent=t("findPick");return;}
    if(pcs.length===1){results.textContent=FIND_NAMES[pcs[0]]+" · "+t("findSingle");return;}
    if(pcs.length===2){
      var bass=notes[0]%12,other=pcs.filter(function(pc){return pc!==bass;})[0];
      results.textContent=FIND_NAMES[bass]+"–"+FIND_NAMES[other]+" · "+t("intervals")[(other-bass+12)%12];
      info(results,t("findTwo"));return;
    }
    results.textContent=t("findNone");return;
  }
  var main=document.createElement("strong");main.textContent=matches[0].name;results.appendChild(main);
  info(results,findMatchInfo(matches[0]));
  if(matches.length>1){
    info(results,t("findContext"));
    var more=document.createElement("details"),summary=document.createElement("summary"),list=document.createElement("ul");
    more.className="find-alternatives";summary.textContent=t("findOther")+" ("+Math.min(6,matches.length-1)+")";
    more.appendChild(summary);
    matches.slice(1,7).forEach(function(m){var item=document.createElement("li"),name=document.createElement("b");name.textContent=m.name;item.appendChild(name);info(item,findMatchInfo(m));list.appendChild(item);});
    more.appendChild(list);results.appendChild(more);
  }
}
for(var cap=0;cap<=12;cap++){var opt=document.createElement("option");opt.value=String(cap);opt.textContent=cap?t("capo")+" "+cap:t("noCapo");$("fcapo").appendChild(opt);}

  var v={fr:F.fr.map(function(f){return f===null||f<0?-1:F.capo+f;})};
  if(v.fr.every(function(f){return f<0;}))return;

document.addEventListener("keydown",function(e){
  var modal=!$("fov").hidden?$("fov"):!$("ov").hidden?$("ov"):null;if(!modal)return;
  if(e.key==="Escape"){e.preventDefault();if(modal===$("fov"))closeFinder();else closeHelp();return;}
  if(e.key!=="Tab")return;
  var focusable=Array.from(modal.querySelectorAll('button,select,input,textarea,a[href],summary,[tabindex="0"]')).filter(function(el){
    var details=el.closest("details");return !el.disabled&&(!details||details.open||el.tagName==="SUMMARY");
  });
  var first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){e.preventDefault();first.focus();}
});
