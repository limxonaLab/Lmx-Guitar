<style>
  :root {
    --bg: #e8eee9;
    --card: #f7faf7;
    --text: #12262a;
    --muted: #5d7377;
    --line: #cbd8d2;
    --brass: #a8761b;
    --good: #14895c;
    --warn: #b9801a;
    --bad: #c8462f;
    --chip: #e3ebe6;
    --chip-on: #12262a;
    --chip-on-text: #f7faf7;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b2025; --card: #12313a; --text: #e9f1ed; --muted: #8fa9ab; --line: #25474f;
      --brass: #e2b155; --good: #6fe3b0; --warn: #e2b155; --bad: #ff7a62;
      --chip: #1a3d46; --chip-on: #e9f1ed; --chip-on-text: #0b2025;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b2025; --card: #12313a; --text: #e9f1ed; --muted: #8fa9ab; --line: #25474f;
    --brass: #e2b155; --good: #6fe3b0; --warn: #e2b155; --bad: #ff7a62;
    --chip: #1a3d46; --chip-on: #e9f1ed; --chip-on-text: #0b2025;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); touch-action: manipulation; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center; padding: 20px 14px 32px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%;
  }
  button { touch-action: manipulation; }
  input { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .app {
    width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line);
    border-radius: 22px; padding: 18px 18px 22px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .hint { color: var(--muted); font-size: .78rem; }
  .brand {
    display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0;
    color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; text-align: left;
  }
  .brand svg { width: 26px; height: 26px; flex: none; color: var(--brass); }
  .brand small { font-family: var(--sans); font-weight: 500; font-size: .72rem; color: var(--muted); margin-left: 2px; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 4px; border-radius: 12px; }
  .modes button {
    border: 0; background: transparent; color: var(--muted); font: 500 .9rem var(--sans);
    padding: 9px 4px; border-radius: 9px; cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  #readout { transition: opacity .25s; }
  #readout.idle { opacity: .38; }
  .gauge text.gn { fill: var(--text); font-family: var(--serif); font-weight: 700; font-size: 58px; letter-spacing: -.02em; }
  .gauge #readout .go { fill: var(--brass); font-family: var(--sans); font-weight: 600; font-size: 22px; letter-spacing: 0; }
  .gauge text.gs { font-size: 11px; }

  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--chip); padding: 4px; border-radius: 12px; margin-top: 8px; }
  .views button {
    border: 0; background: transparent; color: var(--muted); font: 500 .9rem var(--sans);
    padding: 9px 4px; border-radius: 9px; cursor: pointer;
  }
  .views button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
  /* Sahne: iki görünüm aynı hücreyi paylaşır, yükseklik görünüm değişince sabit kalır */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr); margin-top: 28px; }
  #barView, #rollView { grid-row: 1; grid-column: 1; align-self: center; }
  .app[data-view="bar"] #rollView { visibility: hidden; pointer-events: none; }
  .app[data-view="roll"] #barView { visibility: hidden; pointer-events: none; }

  .gauge { width: 100%; height: auto; display: block; margin-top: 4px; }
  .gauge text { font-family: var(--sans); fill: var(--muted); font-size: 11px; }
  .needle { transition: stroke .2s; }
  #rollSvg { width: 100%; height: auto; display: block; margin: 0; filter: drop-shadow(0 3px 5px rgba(0,0,0,.28)); }
  #rollSvg .dyn { transition: opacity .25s; }
  #rollSvg.idle .dyn { opacity: .45; }

  .status { text-align: center; font-weight: 600; font-size: 1.02rem; min-height: 1.6em; margin-top: 6px; }
  .status.good { color: var(--good); }
  .status.warn { color: var(--warn); }
  .status.bad { color: var(--bad); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--chip); border-radius: 12px; padding: 9px 6px; text-align: center; }
  .stat b { display: block; font-size: 1.12rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .74rem; }

  .strings { display: none; margin-top: 16px; }
  .strings.show { display: block; }
  .string-row { display: flex; gap: 5px; justify-content: center; flex-wrap: nowrap; }
  .string-row button {
    flex: 1 1 0; min-width: 0; border: 1px solid var(--line); background: var(--chip); color: var(--text);
    border-radius: 12px; padding: 9px 4px 8px; cursor: pointer; font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .string-row button .n { font-family: var(--serif); font-weight: 700; font-size: 1.25rem; }
  .string-row button .s { font-size: .7rem; color: var(--muted); }
  .string-row button.target { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
  .string-row button.locked { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  .string-row button.locked .s { color: inherit; opacity: .7; }
  .string-row button.done { border-color: var(--good); }
  .strings .hint { text-align: center; margin-top: 8px; }

  .ref { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .ref label { font-size: .9rem; font-weight: 500; }
  .ref .ctl { display: flex; align-items: center; justify-content: center; flex-wrap: nowrap; gap: 6px; }
  .ref .ctl button, .reset {
    border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 9px;
    min-width: 36px; height: 36px; font: 600 1.05rem var(--sans); cursor: pointer;
  }
  .ref input {
    width: 76px; height: 36px; text-align: center; font: 600 1rem var(--sans); color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px; font-variant-numeric: tabular-nums;
  }
  .reset { font-size: .78rem; font-weight: 500; padding: 0 10px; }

  .start { width: 100%; margin-top: 18px; border: 0; border-radius: 14px; padding: 15px; cursor: pointer; font: 600 1rem var(--sans); background: var(--brass); color: #fff; }
  :root[data-theme="dark"] .start { color: #0b2025; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .start { color: #0b2025; } }
  .start.on { background: var(--chip); color: var(--text); border: 1px solid var(--line); }
  .error { color: var(--bad); font-size: .85rem; margin-top: 10px; text-align: center; min-height: 1em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 420px) {
    body { padding: 8px 8px 12px; }
    .app { padding: 12px 12px 14px; border-radius: 18px; }
    header { margin-bottom: 8px; }
    .modes button { padding: 7px 4px; }
    .views { margin-top: 6px; }
    .views button { padding: 7px 4px; }
    .gauge { max-height: none; margin-top: 0; }
    .stage { margin-top: 24px; }
    #rollSvg { margin: 0; max-height: 100%; }
    .status { font-size: .95rem; min-height: 1.4em; margin-top: 4px; }
    .stats { margin-top: 8px; gap: 6px; }
    .stat { padding: 6px 4px; }
    .stat b { font-size: 1rem; }
    .stat span { font-size: .68rem; }
    .strings { margin-top: 8px; }
    .strings .hint { display: none; }
    .string-row button { padding: 6px 0 5px; border-radius: 10px; }
    .string-row button .n { font-size: 1.05rem; }
    .string-row button .s { font-size: .62rem; }
    .ref { margin-top: 10px; padding-top: 8px; gap: 6px; }
    .start { margin-top: 10px; padding: 12px; }
    .error { margin-top: 5px; }
  }
</style>
</head>
<body>
<main class="app" id="app" data-view="roll">
  <header>
    <h1>
      <button class="brand" id="brand" type="button" aria-label="Sayfayı yenile">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4v10a5 5 0 0 0 10 0V4"/>
          <path d="M16 19v9"/>
          <path d="M5.5 8.5c-1.3 1.6-1.3 4.4 0 6" opacity=".6"/>
          <path d="M26.5 8.5c1.3 1.6 1.3 4.4 0 6" opacity=".6"/>
        </svg>
        <span>LmX Tuner <small>v1.2</small></span>
      </button>
    </h1>
    <span class="hint" id="hzHint">A4 = 440 Hz</span>
  </header>

  <div class="modes" role="group" aria-label="Mod">
    <button data-mode="chromatic" aria-pressed="true">Kromatik</button>
    <button data-mode="guitar" aria-pressed="false">Gitar</button>
    <button data-mode="ukulele" aria-pressed="false">Ukulele</button>
  </div>

  <div class="views" role="group" aria-label="Görünüm">
    <button type="button" data-view="bar" aria-pressed="false">Çubuk</button>
    <button type="button" data-view="roll" aria-pressed="true">Şerit</button>
  </div>

  <div class="stage">
    <div id="barView"><svg class="gauge" id="gauge" viewBox="0 26 320 162" role="img" aria-label="Çubuk akort göstergesi"></svg></div>
    <div id="rollView"><svg id="rollSvg" class="idle" viewBox="0 0 340 156" role="img" aria-label="Kayan notalar akort göstergesi"></svg></div>
  </div>
  <div class="status" id="status"></div>

  <div class="stats">
    <div class="stat"><b id="freq">–</b><span>Frekans (Hz)</span></div>
    <div class="stat"><b id="target">–</b><span>Hedef (Hz)</span></div>
    <div class="stat"><b id="cents">–</b><span>Sapma (cent)</span></div>
  </div>

  <section class="strings" id="strings">
    <div class="string-row" id="stringRow"></div>
    <div class="hint">Tel otomatik algılanır. Bir tele dokunursan kilitlenir ve sesi çalar; tekrar dokunursan serbest kalır.</div>
  </section>

  <div class="ref">
    <label for="ref">Referans (A4)</label>
    <div class="ctl">
      <button type="button" id="refMinus" aria-label="Referansı azalt">−</button>
      <input id="ref" type="number" min="400" max="480" step="0.5" value="440" inputmode="decimal">
      <button type="button" id="refPlus" aria-label="Referansı artır">+</button>
      <button type="button" class="reset" id="refReset">440</button>
    </div>
  </div>

  <button class="start" id="start" type="button">Mikrofonu başlat</button>
  <div class="error" id="error" role="alert"></div>
</main>

<script>
(function () {
  "use strict";

  /* ---------- sabitler ---------- */
  var NOTES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  var SOL   = ["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
  var INSTRUMENTS = {
    guitar:  [ {midi:40,s:"6. tel"}, {midi:45,s:"5. tel"}, {midi:50,s:"4. tel"}, {midi:55,s:"3. tel"}, {midi:59,s:"2. tel"}, {midi:64,s:"1. tel"} ],
    ukulele: [ {midi:67,s:"4. tel"}, {midi:60,s:"3. tel"}, {midi:64,s:"2. tel"}, {midi:69,s:"1. tel"} ]
  };
  var IN_TUNE = 5;            // ± cent: "Doğru"
  var YIN_WINDOW = 3072;      // örnek: daha uzun pencere = daha hassas ölçüm
  var FFT_SIZE = 8192;

  /* ---------- durum ---------- */
  var state = { mode: "chromatic", ref: 440, locked: null, running: false, starting: false, want: false, view: "roll", autoIdx: null };
  var $ = function (id) { return document.getElementById(id); };
  var audioCtx = null, analyser = null, stream = null, source = null, buf = null;
  var rafId = 0, lastAnalysis = 0, lastHit = 0, muteUntil = 0, lastFrame = 0, zeroFrames = 0, hasReading = false;
  var hist = [], smoothLf = null, pendLf = null, pendN = 0;
  // Görünüm durumu (iki görünüm de bunlardan beslenir)
  var viewPos = 69, viewTargetPos = 69, viewMidi = 69, snapNext = true, statusCls = "";

  /* ---------- kayıt ---------- */
  function load() {
    try {
      var r = parseFloat(localStorage.getItem("tuner.ref"));
      if (r >= 400 && r <= 480) state.ref = r;
      var m = localStorage.getItem("tuner.mode");
      if (m && (m === "chromatic" || INSTRUMENTS[m])) state.mode = m;
      var v = localStorage.getItem("tuner.view2");
      if (v === "bar" || v === "roll") state.view = v;
      state.want = localStorage.getItem("tuner.auto") === "1";
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem("tuner.ref", String(state.ref));
      localStorage.setItem("tuner.mode", state.mode);
      localStorage.setItem("tuner.view2", state.view);
    } catch (e) {}
  }
  function saveWant(v) { try { localStorage.setItem("tuner.auto", v ? "1" : "0"); } catch (e) {} }

  /* ---------- müzik matematiği ---------- */
  function midiToFreq(m) { return state.ref * Math.pow(2, (m - 69) / 12); }
  function freqToMidi(f) { return 12 * Math.log2(f / state.ref) + 69; }
  function noteLabel(m) { return NOTES[((m % 12) + 12) % 12]; }
  function solLabel(m)  { return SOL[((m % 12) + 12) % 12]; }
  function octaveOf(m)  { return Math.floor(m / 12) - 1; }
  function fmtHz(f) { return f.toFixed(f < 100 ? 2 : 1); }
  function median(arr) { var a = arr.slice().sort(function (p, q) { return p - q; }); return a[a.length >> 1]; }

  /* ---------- YIN perde algılama (tek analiz sistemi) ---------- */
  var yinBuf = null;
  function detect(data, sr) {
    var W = data.length >> 1;
    var tauMax = Math.min(W - 2, Math.floor(sr / 55));
    var tauMin = Math.max(2, Math.floor(sr / 1400));
    if (!yinBuf || yinBuf.length !== tauMax + 2) yinBuf = new Float32Array(tauMax + 2);
    var d = yinBuf, run = 0, tau, i, x, s;
    d[0] = 1;
    for (tau = 1; tau <= tauMax; tau++) {
      s = 0;
      for (i = 0; i < W; i++) { x = data[i] - data[i + tau]; s += x * x; }
      run += s;
      d[tau] = run > 0 ? (s * tau) / run : 1;
    }
    var found = -1;
    for (tau = tauMin; tau <= tauMax; tau++) {
      if (d[tau] < 0.15) {
        while (tau + 1 <= tauMax && d[tau + 1] < d[tau]) tau++;
        found = tau; break;
      }
    }
    if (found < 0) return null;
    var better = found;
    if (found > 1 && found < tauMax) {
      var x0 = d[found - 1], x1 = d[found], x2 = d[found + 1];
      var den = x0 + x2 - 2 * x1;
      if (den !== 0) better = found + (x0 - x2) / (2 * den);
    }
    return { freq: sr / better, clarity: 1 - d[found] };
  }

  /* ---------- ölçüm yumuşatma: medyan + üstel filtre + sıçrama koruması ---------- */
  function resetTracking() { hist = []; smoothLf = null; pendLf = null; pendN = 0; state.autoIdx = null; }
  function track(freq) {
    var lf = Math.log2(freq);
    if (smoothLf !== null) {
      var dc = Math.abs(lf - smoothLf) * 1200;
      if (dc > 80) {                       // ani büyük sıçrama: 3 ardışık tutarlı ölçüm gelmeden kabul etme
        if (pendLf !== null && Math.abs(lf - pendLf) * 1200 < 40) {
          pendN++;
          if (pendN >= 3) { smoothLf = lf; hist = [lf]; pendLf = null; pendN = 0; }
        } else { pendLf = lf; pendN = 1; }
        return Math.pow(2, smoothLf);
      }
      pendLf = null; pendN = 0;
    }
    hist.push(lf);
    if (hist.length > 7) hist.shift();
    var med = median(hist);
    smoothLf = smoothLf === null ? med : smoothLf + (med - smoothLf) * 0.35;
    return Math.pow(2, smoothLf);
  }

  /* ---------- Bar Meter (SVG) ---------- */
  var CX = 160, CY = 172, R = 138, SPAN = 62;
  function degOf(c) { return (Math.max(-50, Math.min(50, c)) / 50) * SPAN; }
  function pt(deg, r) { var a = deg * Math.PI / 180; return [CX + r * Math.sin(a), CY - r * Math.cos(a)]; }
  function arcPath(c1, c2, r) {
    var p1 = pt(degOf(c1), r), p2 = pt(degOf(c2), r);
    return "M" + p1[0].toFixed(2) + " " + p1[1].toFixed(2) + " A" + r + " " + r + " 0 0 1 " + p2[0].toFixed(2) + " " + p2[1].toFixed(2);
  }
  function buildGauge() {
    var g = $("gauge"), h = "";
    h += '<path d="' + arcPath(-50, 50, R) + '" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>';
    h += '<path d="' + arcPath(-IN_TUNE, IN_TUNE, R) + '" fill="none" stroke="var(--good)" stroke-width="10" opacity=".9"/>';
    for (var c = -50; c <= 50; c += 5) {
      var major = c % 25 === 0, mid = c % 10 === 0;
      var len = major ? 20 : (mid ? 13 : 8);
      var a = pt(degOf(c), R - 12), b = pt(degOf(c), R - 12 - len);
      h += '<line x1="' + a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) + '" x2="' + b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) +
           '" stroke="' + (c === 0 ? "var(--good)" : "var(--muted)") + '" stroke-width="' + (major ? 2.2 : 1.2) + '" stroke-linecap="round"/>';
    }
    [-50, -25, 0, 25, 50].forEach(function (c) {
      var p = pt(degOf(c), R - 42);
      h += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 4).toFixed(1) + '" text-anchor="middle">' + (c > 0 ? "+" + c : String(c)) + '</text>';
    });
    h += '<text x="14" y="184" text-anchor="start">♭ pes</text><text x="306" y="184" text-anchor="end">tiz ♯</text>';
    h += '<g id="readout" class="idle" aria-live="polite"><text class="gn" x="160" y="134" text-anchor="middle"><tspan id="noteName">–</tspan><tspan id="octave" class="go" dx="3"></tspan></text><text id="solfege" class="gs" x="160" y="154" text-anchor="middle">Mikrofonu başlatıp bir nota çal</text></g>';

      '</defs>';
    h += '<rect x="1" y="1" width="338" height="154" rx="22" fill="url(#rb)" stroke="#b8893a" stroke-width="1.4"/>';
    h += '<rect x="4" y="4" width="332" height="148" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".12"/>';
    h += '<rect x="9" y="9" width="322" height="138" rx="15" fill="url(#rp)"/>';

  function renderRoll(cents) {

  /* ---------- her karede görünümü güncelle (yumuşak hareket) ---------- */
  function animate(now) {

    else if (Math.abs(diff) < 0.0004) viewPos = viewTargetPos;
    else viewPos += diff * a;
    var cents = (viewPos - viewMidi) * 100;
    if (state.view === "bar") {
      $("needleG").setAttribute("transform", "rotate(" + degOf(cents).toFixed(2) + " " + CX + " " + CY + ")");
      $("needle").setAttribute("stroke", colorOf(statusCls));
    } else {
      renderRoll(cents);
    }
  }

  /* ---------- arayüz ---------- */

  function renderStrings() {

    wrap.classList.add("show");
    row.innerHTML = "";
    list.forEach(function (st, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="n">' + noteLabel(st.midi) + octaveOf(st.midi) + '</span><span class="s">' + st.s + '</span>';
      b.addEventListener("click", function () {
        if (state.locked === i) state.locked = null;
        else { state.locked = i; playTone(midiToFreq(st.midi)); }

      });

  function showReading(freq) {

          if (i === state.autoIdx) curd = dc;

  /* ---------- ses ---------- */

      } else zeroFrames = 0;

  /* ---------- mikrofon yaşam döngüsü ---------- */

  /* ---------- referans frekans ---------- */

  /* ---------- ekranı açık tut ---------- */

  function playKeepAwake() {
    try {
      var v = ensureVideo();
      if (v.paused) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
    } catch (e) {}
  }
  function keepAwake() {
    if (audioCtx && (audioCtx.state === "suspended" || audioCtx.state === "interrupted")) { try { audioCtx.resume(); } catch (e) {} }
    if (!wakeLock) requestWake();
    if (document.visibilityState === "visible") playKeepAwake();
  }

  /* ---------- başlat ---------- */
  load();
  buildGauge();
  buildRoll();
  $("ref").value = state.ref;
  $("hzHint").textContent = "A4 = " + state.ref + " Hz";
  document.querySelectorAll(".modes button").forEach(function (b) { b.addEventListener("click", function () { setMode(b.dataset.mode); }); });
  document.querySelectorAll(".views button").forEach(function (b) { b.addEventListener("click", function () { setView(b.dataset.view); }); });
  setView(state.view);
  setMode(state.mode);
  setStartUI();
  $("brand").addEventListener("click", function () { location.reload(); });
  $("start").addEventListener("click", function () {
    if (state.want || state.running) userStop(); else start(false);
  });
  $("ref").addEventListener("change", function (e) { setRef(e.target.value); });
  $("refMinus").addEventListener("click", function () { setRef(state.ref - 0.5); });
  $("refPlus").addEventListener("click", function () { setRef(state.ref + 0.5); });
  $("refReset").addEventListener("click", function () { setRef(440); });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  // Dokunuş: ses motorunu uyandır, ekranı açık tut, istenen mikrofon kapalıysa yeniden dene
  document.addEventListener("touchend", function () {
    keepAwake();
    if (state.want && !state.running && !state.starting) start(true);
  }, { passive: true });
  document.addEventListener("click", keepAwake);

  // Başka uygulamaya geçiş / arama / medya sonrası dönüş
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      teardown();                                   // mikrofonu bırak, bozuk oturum kalmasın
      try { if (keepVideo) keepVideo.pause(); } catch (e) {}
    } else {
      keepAwake();
      if (state.want) setTimeout(function () { start(true); }, 250);
    }
  });
  window.addEventListener("pageshow", function () { if (state.want && !state.running) start(true); });
  window.addEventListener("focus", function () { if (state.want && !state.running && !state.starting) start(true); });

  requestWake();
  if (state.want) start(true);
  rafId = requestAnimationFrame(loop);
